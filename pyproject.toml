[project]
name = "corrective-fairness"
version = "0.1.0"
description = "Experiment for corrective fairness in machine learning"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.10.7",
    "mdpax>=0.2.2 ; sys_platform != 'linux'",
    "numpy>=2.3.4",
    "seaborn>=0.13.2",
    "tqdm>=4.67.1",
    "typinox>=0.4.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "ipywidgets>=8.1.8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["fairsim"]
exclude = []
# namespaces = false

[tool.ruff]
line-length = 80
target-version = "py313"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
typing-modules = ["beartype.typing"]
select = [
    "E4", "E7", "E9",
    "F",
    "UP", # pyupgrade
    "I",   # isort
]
ignore = ["F722", "E741"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["F401", "E731"]

[tool.ruff.lint.isort]
force-wrap-aliases = true
combine-as-imports = true
